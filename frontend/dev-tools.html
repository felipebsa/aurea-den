<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Áurea Den - Dev Tools</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="logo">🦊 Áurea Den</div>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="lists.html">Listas</a></li>
        <li><a href="releases.html">Lançamentos</a></li>
        <li><a href="genres.html">Gênero</a></li>
        <li><a href="about.html">Sobre</a></li>
        <!-- o link "Dev Tools" com destaque ativo é injetado pelo js/auth.js -->
      </ul>
    </nav>
    <div class="acoes-header">
      <button id="botao-conta">👤</button>
    </div>
  </header>

  <!-- modal de login/cadastro (fica em toda página, por padrão do site) -->
  <div id="modal-auth" class="escondido">
    <div class="caixa-modal">
      <button id="fechar-modal">×</button>

      <div id="area-login">
        <h2>Entrar</h2>
        <form id="form-login">
          <input type="text" id="login-usuario" placeholder="Usuário" required />
          <input type="password" id="login-senha" placeholder="Senha" required />
          <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <a href="#" id="ir-para-cadastro">Cadastre-se</a></p>
        <p id="login-erro" class="erro"></p>
      </div>

      <div id="area-cadastro" class="escondido">
        <h2>Criar conta</h2>
        <form id="form-cadastro">
          <input type="text" id="cadastro-usuario" placeholder="Usuário" required />
          <input type="password" id="cadastro-senha" placeholder="Senha" required />
          <select id="cadastro-role">
            <option value="CLIENT" selected>Cliente</option>
            <option value="ADM">Administrador</option>
          </select>
          <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem conta? <a href="#" id="ir-para-login">Entrar</a></p>
        <p id="cadastro-erro" class="erro"></p>
      </div>
    </div>
  </div>

  <!-- modal usado tanto pra CRIAR quanto pra EDITAR filme (o título e o botão mudam via JS) -->
  <div id="modal-filme-dev" class="escondido">
    <div class="caixa-modal caixa-modal-larga">
      <button id="fechar-modal-filme-dev">×</button>
      <h2 id="titulo-modal-filme-dev">Cadastrar filme</h2>
      <form id="form-filme-dev">
        <input type="hidden" id="filme-dev-id" />
        <input type="text" id="filme-dev-titulo" placeholder="Título" required />
        <input type="url" id="filme-dev-capa" placeholder="URL da capa" required />
        <input type="url" id="filme-dev-banner" placeholder="URL do banner (opcional)" />
        <textarea id="filme-dev-descricao" placeholder="Descrição" required></textarea>
        <input type="number" id="filme-dev-nota" placeholder="Nota (0 a 10)" min="0" max="10" step="0.1" required />
        <button type="submit" id="botao-salvar-filme-dev">Adicionar</button>
      </form>
      <p id="form-filme-dev-erro" class="erro"></p>
    </div>
  </div>

  <main>
    <section id="secao-dev-tools">
      <div class="cabecalho-secao">
        <h2>Dev Tools — Filmes</h2>
        <button id="botao-add-filme-dev" class="botao-adicionar-dev">+ Novo filme</button>
      </div>

      <div id="lista-dev-filmes"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dev-tools.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Áurea Den</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="logo">🦊 Áurea Den</div>
    <nav>
      <ul>
        <li><a href="index.html" class="link-ativo">Início</a></li>
        <li><a href="lists.html">Listas</a></li>
        <li><a href="releases.html">Lançamentos</a></li>
        <li><a href="genres.html">Gênero</a></li>
        <li><a href="about.html">Sobre</a></li>
      </ul>
    </nav>
    <div class="acoes-header">
      <input type="text" id="campo-busca" placeholder="Buscar filmes..." />
      <button id="botao-add-filme" class="escondido" title="Cadastrar filme">+</button>
      <button id="botao-conta">👤</button>
    </div>
  </header>

  <!-- modal de login/cadastro -->
  <div id="modal-auth" class="escondido">
    <div class="caixa-modal">
      <button id="fechar-modal">×</button>

      <div id="area-login">
        <h2>Entrar</h2>
        <form id="form-login">
          <input type="text" id="login-usuario" placeholder="Usuário" required />
          <input type="password" id="login-senha" placeholder="Senha" required />
          <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <a href="#" id="ir-para-cadastro">Cadastre-se</a></p>
        <p id="login-erro" class="erro"></p>
      </div>

      <div id="area-cadastro" class="escondido">
        <h2>Criar conta</h2>
        <form id="form-cadastro">
          <input type="text" id="cadastro-usuario" placeholder="Usuário" required />
          <input type="password" id="cadastro-senha" placeholder="Senha" required />
          <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem conta? <a href="#" id="ir-para-login">Entrar</a></p>
        <p id="cadastro-erro" class="erro"></p>
      </div>
    </div>
  </div>

  <!-- modal que abre quando clica no "+" (só aparece logado) pra cadastrar filme -->
  <div id="modal-add-filme" class="escondido">
    <div class="caixa-modal">
      <button id="fechar-modal-add">×</button>
      <h2>Cadastrar filme</h2>
      <form id="form-filme">
        <input type="text" id="filme-titulo" placeholder="Título" required />
        <input type="url" id="filme-capa" placeholder="URL da capa" required />
        <textarea id="filme-descricao" placeholder="Descrição" required></textarea>
        <input type="number" id="filme-nota" placeholder="Nota (0 a 10)" min="0" max="10" step="0.1" required />
        <button type="submit">Adicionar</button>
      </form>
      <p id="form-filme-erro" class="erro"></p>
    </div>
  </div>

  <!-- modal que abre quando clica em um filme, pra ver os detalhes -->
  <div id="modal-detalhes" class="escondido">
    <div class="caixa-modal caixa-modal-filme">
      <button id="fechar-modal-detalhes">×</button>
      <img id="detalhes-capa" src="" alt="" />
      <div class="texto-detalhes">
        <h2 id="detalhes-titulo"></h2>
        <p id="detalhes-nota"></p>
        <p id="detalhes-descricao"></p>
      </div>
    </div>
  </div>

  <!-- banner grande com o filme em destaque -->
  <section id="banner-destaque">
    <button id="banner-anterior" class="seta-banner">‹</button>

    <div id="conteudo-banner">
      <span id="banner-tag"></span>
      <h1 id="banner-titulo"></h1>
      <p id="banner-descricao"></p>
      <button id="banner-assistir">▶ Assistir</button>
    </div>

    <div id="banner-bolinhas"></div>
    <button id="banner-proximo" class="seta-banner">›</button>
  </section>

  <main>
    <section id="secao-filmes">
      <div class="cabecalho-secao">
        <h2>Filmes</h2>
        <a href="lists.html">Ver todos →</a>
      </div>

      <div id="grade-filmes"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render-movies.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
